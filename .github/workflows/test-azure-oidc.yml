name: Test Azure OIDC Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-azure-login:
    name: Test Azure Login
    runs-on: ubuntu-latest

    environment: chs-dev-wus2

    steps:
      - name: Login to Azure using GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Display Azure subscription context
        shell: bash
        run: |
          set -euo pipefail

          az account show \
            --query "{
              subscriptionName:name,
              subscriptionId:id,
              tenantId:tenantId
            }" \
            --output table

      - name: Verify target resource group
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
        run: |
          set -euo pipefail

          az group show \
            --name "$AZURE_RESOURCE_GROUP" \
            --query "{
              name:name,
              location:location,
              provisioningState:properties.provisioningState
            }" \
            --output table

      - name: Verify Grafana Container App access
        shell: bash
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          GRAFANA_CONTAINER_APP: ${{ vars.GRAFANA_CONTAINER_APP }}
        run: |
          set -euo pipefail

          az containerapp show \
            --name "$GRAFANA_CONTAINER_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "{
              name:name,
              currentImage:properties.template.containers[0].image,
              latestRevision:properties.latestRevisionName,
              provisioningState:properties.provisioningState
            }" \
            --output table
