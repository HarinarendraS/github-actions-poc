name: Environment Variables and Secrets POC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-development:
    name: Validate development environment
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Display environment variable
        env:
          DEPLOYMENT_REGION: ${{ vars.DEPLOYMENT_REGION }}
        run: |
          if [ -z "$DEPLOYMENT_REGION" ]; then
            echo "DEPLOYMENT_REGION is unavailable"
            exit 1
          fi

          echo "Deployment region: $DEPLOYMENT_REGION"

      - name: Validate environment secret
        env:
          ENVIRONMENT_API_KEY: ${{ secrets.ENVIRONMENT_API_KEY }}
        run: |
          if [ -z "$ENVIRONMENT_API_KEY" ]; then
            echo "ENVIRONMENT_API_KEY is unavailable"
            exit 1
          fi

          echo "Environment secret validation passed"