name: Deploy Grafana DEV to QA

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Grafana image tag"
        required: true
        default: "13.0.2"
        type: string

permissions:
  id-token: write
  contents: read

jobs:

  deploy-dev:

    name: Deploy DEV

    uses: HarinarendraS/github-actions-templates/.github/workflows/reusable-containerapp-deploy.yml@main

    with:
      environment: chs-dev-wus2
      runner_label: chs-dev-runner
      image_tag: ${{ inputs.image_tag }}

    secrets: inherit


