name: Variables and Secrets POC

on:
  workflow_dispatch:
    inputs:
      execution_reason:
        description: Reason for running the POC
        required: false
        default: Manual variable and secret validation
        type: string

permissions:
  contents: read

env:
  POC_APPLICATION_NAME: github-actions-poc
  POC_WORKFLOW_TYPE: variables-and-secrets

jobs:
  validate-configuration:
    name: Validate variables and secrets
    runs-on: ubuntu-latest

    env:
      POC_JOB_NAME: configuration-validation
      REPOSITORY_ENVIRONMENT: ${{ vars.POC_ENVIRONMENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display non-sensitive workflow variables
        run: |
          echo "Application name: $POC_APPLICATION_NAME"
          echo "Workflow type: $POC_WORKFLOW_TYPE"
          echo "Job name: $POC_JOB_NAME"
          echo "Repository environment: $REPOSITORY_ENVIRONMENT"
          echo "Execution reason: ${{ inputs.execution_reason }}"

      - name: Display safe GitHub default variables
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Reference: $GITHUB_REF"
          echo "Commit SHA: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"
          echo "Run ID: $GITHUB_RUN_ID"
          echo "Run number: $GITHUB_RUN_NUMBER"

      - name: Validate repository variable
        run: |
          if [ -z "$REPOSITORY_ENVIRONMENT" ]; then
            echo "Validation failed: POC_ENVIRONMENT is unavailable"
            exit 1
          fi

          if [ "$REPOSITORY_ENVIRONMENT" != "development" ]; then
            echo "Validation failed: unexpected POC_ENVIRONMENT value"
            exit 1
          fi

          echo "Repository variable validation passed"

      - name: Validate secret availability
        env:
          POC_API_KEY: ${{ secrets.POC_API_KEY }}
        run: |
          if [ -z "$POC_API_KEY" ]; then
            echo "Validation failed: POC_API_KEY is unavailable"
            exit 1
          fi

          echo "Secret availability validation passed"
          echo "The secret value will not be printed"

      - name: Demonstrate secret masking
        env:
          POC_API_KEY: ${{ secrets.POC_API_KEY }}
        run: |
          echo "::add-mask::$POC_API_KEY"
          echo "The following value should be masked by GitHub:"
          echo "$POC_API_KEY"

      - name: Use step-level environment variable
        env:
          STEP_MESSAGE: This value exists only inside this step
        run: |
          echo "Step-level value: $STEP_MESSAGE"

      - name: Create safe POC evidence
        run: |
          mkdir -p evidence

          {
            echo "GitHub Actions Variables and Secrets POC"
            echo "========================================"
            echo "Application: $POC_APPLICATION_NAME"
            echo "Workflow type: $POC_WORKFLOW_TYPE"
            echo "Environment: $REPOSITORY_ENVIRONMENT"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Reference: $GITHUB_REF"
            echo "Commit SHA: $GITHUB_SHA"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Run number: $GITHUB_RUN_NUMBER"
            echo "Variable validation: Passed"
            echo "Secret availability validation: Passed"
            echo "Secret value included in evidence: No"
            echo "Overall status: Successful"
          } > evidence/variables-secrets-poc-result.txt

      - name: Display evidence without secret
        run: cat evidence/variables-secrets-poc-result.txt

      - name: Upload POC evidence
        uses: actions/upload-artifact@v4
        with:
          name: variables-secrets-poc-evidence
          path: evidence/variables-secrets-poc-result.txt
          if-no-files-found: error
          retention-days: 7